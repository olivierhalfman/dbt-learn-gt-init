models:
  - name: stg_jaffle_shop_customers
    description: The grain of this table is one unique customer per row.
    columns:
      - name: customer_id
        description: This is the primary key for the customers table.
        tests:
          - unique
          - not_null

  - name: stg_jaffle_shop_orders
    description: One order per row
    columns:
      - name: order_id
        description: This is the primary key for the orders table.
        tests:
          - unique
          - not_null
      - name: order_status
        description: "{{ doc('order_status') }}"
        tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop_customers')
                field: customer_id